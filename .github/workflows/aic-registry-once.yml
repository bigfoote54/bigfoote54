name: AIC registry one-time submission
on:
  push:
    paths:
      - '.github/workflows/aic-registry-once.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register-aic-concierge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Submit published Agent Card to public A2A Registry
        run: python3 scripts/aic_registry_ingest_once.py
