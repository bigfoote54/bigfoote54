name: AIC registry registration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  register-aic-concierge:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check and submit AIC Agent Card to public directory
        run: python3 scripts/aic_registry_ingest_once.py
